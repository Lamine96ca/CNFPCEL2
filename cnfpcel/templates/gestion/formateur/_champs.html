<div class="row g-3">
  {% for field in form %}
    <div class="{% if field.name == 'bio' %}col-12{% else %}col-md-6{% endif %}">
      <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle-fill me-1"></i>{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  <div class="col-12">
    <label class="form-label">Formations dispensées</label>
    {% if form_formations.formations.field.queryset %}
      <div class="row g-2">
        {% for case in form_formations.formations %}
          <div class="col-md-6">
            <label class="bloc-element d-flex gap-2 align-items-start m-0 h-100" style="cursor:pointer">
              {{ case.tag }} <span class="small">{{ case.choice_label }}</span>
            </label>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-secondary small">Aucune formation n'a encore été créée.</div>
    {% endif %}
  </div>
</div>
