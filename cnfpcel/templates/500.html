<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur — CNFPATEL</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f7fb;
           font-family: "Century Gothic", "Segoe UI", Arial, sans-serif; color: #36495a; padding: 16px; }
    .boite { max-width: 520px; text-align: center; background: #fff; border-radius: 16px; padding: 40px 28px;
             border-top: 5px solid #0077B6; box-shadow: 0 10px 30px rgba(0, 0, 0, .06); }
    .code { font-size: 4rem; font-weight: 800; color: #0077B6; line-height: 1; }
    h1 { color: #1f2d3a; font-size: 1.4rem; }
    a { display: inline-block; margin-top: 12px; padding: 11px 20px; border-radius: 10px;
        background: #0077B6; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="boite">
    <div class="code">500</div>
    <h1>Un problème est survenu</h1>
    <p>Le service rencontre une erreur momentanée. L'équipe technique a été informée ; merci de réessayer dans quelques instants.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
