
{% extends 'accueil/base/base.html' %}

{% block content %}
{% load static %}

<style>

/* =========================================================
   PAGE INDISPONIBLE — CNFPCEL
========================================================= */

:root {
    --primary: #0077B6;
    --primary-dark: #005b8a;
    --primary-light: #eaf7fc;

    --text: #243746;
    --muted: #718096;

    --white: #ffffff;

    --border: #e3ebf0;

    --shadow:
        0 15px 45px rgba(30, 60, 80, .12);
}


/* =========================================================
   SECTION
========================================================= */

#contenu-indisponible {

    min-height: calc(100vh - 80px);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 60px 15px;

    background:
        linear-gradient(
            135deg,
            #0077B6 0%,
            #005b8a 100%
        );

    position: relative;

    overflow: hidden;
}


/* =========================================================
   DECORATIONS
========================================================= */

#contenu-indisponible::before {

    content: "";

    position: absolute;

    width: 420px;
    height: 420px;

    top: -230px;
    right: -150px;

    border-radius: 50%;

    background: rgba(255,255,255,.07);

}


#contenu-indisponible::after {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    bottom: -180px;
    left: -100px;

    border-radius: 50%;

    background: rgba(255,255,255,.06);

}


/* =========================================================
   CONTAINER
========================================================= */

.unavailable-container {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 650px;

}


/* =========================================================
   CARD
========================================================= */

.unavailable-card {

    padding: 45px 40px;

    background: rgba(255,255,255,.97);

    border: 1px solid rgba(255,255,255,.25);

    border-radius: 22px;

    box-shadow: var(--shadow);

    text-align: center;

    animation:
        unavailableAppear .55s ease both;
}


/* =========================================================
   ICON
========================================================= */

.unavailable-icon {

    width: 78px;
    height: 78px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    background: var(--primary-light);

    color: var(--primary);

    border-radius: 50%;

    font-size: 2rem;

    box-shadow:
        0 8px 22px rgba(0,119,182,.10);

}


/* =========================================================
   BADGE
========================================================= */

.unavailable-badge {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 15px;

    padding: 7px 13px;

    background: #fff4e5;

    color: #a86600;

    border-radius: 50px;

    font-size: .70rem;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .4px;

}


/* =========================================================
   TITLE
========================================================= */

.unavailable-title {

    margin-bottom: 12px;

    color: var(--text);

    font-size: clamp(1.6rem, 4vw, 2.2rem);

    font-weight: 800;

    line-height: 1.25;

}


/* =========================================================
   TEXT
========================================================= */

.unavailable-text {

    max-width: 520px;

    margin: 0 auto;

    color: var(--muted);

    font-size: .95rem;

    line-height: 1.75;

}

.unavailable-text + .unavailable-text {

    margin-top: 8px;

}


/* =========================================================
   SEPARATOR
========================================================= */

.unavailable-line {

    width: 55px;
    height: 4px;

    margin: 22px auto;

    border-radius: 50px;

    background: var(--primary);

}


/* =========================================================
   BUTTON
========================================================= */

.unavailable-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 25px;

    padding: 11px 24px;

    background: var(--primary);

    border: 0;

    border-radius: 10px;

    color: #fff !important;

    font-size: .84rem;

    font-weight: 800;

    text-decoration: none;

    box-shadow:
        0 7px 18px rgba(0,119,182,.20);

    transition: .3s ease;

}


.unavailable-button:hover {

    background: var(--primary-dark);

    color: #fff !important;

    transform: translateY(-2px);

    box-shadow:
        0 10px 23px rgba(0,119,182,.28);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 575px) {

    #contenu-indisponible {

        min-height: calc(100vh - 65px);

        padding: 35px 12px;

    }


    .unavailable-card {

        padding: 32px 20px;

        border-radius: 17px;

    }


    .unavailable-icon {

        width: 65px;
        height: 65px;

        font-size: 1.65rem;

    }


    .unavailable-title {

        font-size: 1.45rem;

    }


    .unavailable-text {

        font-size: .86rem;

    }


    .unavailable-button {

        width: 100%;

    }

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes unavailableAppear {

    from {

        opacity: 0;

        transform:
            translateY(18px)
            scale(.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}

</style>



<!-- =========================================================
     PAGE INDISPONIBLE
========================================================= -->

<section id="contenu-indisponible">


    <div class="unavailable-container">


        <div class="unavailable-card">


            <!-- =================================================
                 ICONE
            ================================================== -->

            <div class="unavailable-icon">

                <i class="bi bi-hourglass-split"></i>

            </div>



            <!-- =================================================
                 STATUT
            ================================================== -->

            <div class="unavailable-badge">

                <i class="bi bi-clock"></i>

                Bientôt disponible

            </div>



            <!-- =================================================
                 TITRE
            ================================================== -->

            <h1 class="unavailable-title">

                Page indisponible

            </h1>



            <div class="unavailable-line"></div>



            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <p class="unavailable-text">

                Cette page est actuellement indisponible.

            </p>


            <p class="unavailable-text">

                Elle sera disponible dans un bref délai pour
                mieux répondre aux attentes des collectivités locales.

            </p>



            <!-- =================================================
                 ACTION
            ================================================== -->

            <a href="{% url 'index' %}"
               class="unavailable-button">

                <i class="bi bi-house-door-fill"></i>

                Retour à l’accueil

            </a>


        </div>


    </div>


</section>


{% endblock %}
