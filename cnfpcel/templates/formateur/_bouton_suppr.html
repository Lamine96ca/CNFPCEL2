<button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#suppr-{{ url_nom }}-{{ action }}" title="Supprimer"><i class="bi bi-trash"></i></button>
<div class="modal fade text-start" id="suppr-{{ url_nom }}-{{ action }}" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Confirmer la suppression</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        Supprimer <strong>« {{ libelle|truncatechars:80 }} »</strong> ?
        {% if avertissement %}<div class="small text-danger mt-2">{{ avertissement }}</div>{% endif %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Annuler</button>
        <form method="post" action="{% url url_nom action %}">{% csrf_token %}<button class="btn btn-danger">Supprimer</button></form>
      </div>
    </div>
  </div>
</div>
